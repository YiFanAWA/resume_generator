<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.font.im/css?family=Rubik" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
    <script type="module" src="js/register.js"></script>
    <title>Register</title>
  </head>
  <body>
    <div class="container-register">
      <div class="card">
        <h1 class="h1-register-text">Create Account</h1>
        <form class="form-register">
          <div class="input-register">
            <p class="input-text">Username</p>
            <input type="text" placeholder="" class="input-username" required />
          </div>
          <div class="input-register">
            <p class="input-text">Password</p>
            <input type="password" placeholder="" class="input-password" minlength="8" required />
          </div>
          <div class="input-register">
            <p class="input-text">Confirm Password</p>
            <input type="password" placeholder="" class="input-confirm-password" minlength="8" required />
          </div>
          <button class="button-register" type="submit">Register</button>
        </form>
        <p class="link-lognin">
          Already have an account?&nbsp;
          <a href="login.html">Login here</a>
        </p>
      </div>
    </div>
  </body>
</html>
