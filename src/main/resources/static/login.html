<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="js/login.js"></script>
    <title>Login</title>
    <link href="https://fonts.font.im/css?family=Rubik" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container-login">
      <h1 class="h1-text">Please sign in</h1>
      <form class="form-login">
        <input type="text" name="username" class="input-username" placeholder="Username" required />
        <input type="password" name="password" class="input-password" placeholder="Password" required />
        <button class="button-loginin" type="submit">Sign in</button>
      </form>

      <p class="link-create-account">
        Don't have an account?&nbsp;
        <a href="register.html">Create one</a>
      </p>
    </div>
  </body>
</html>
