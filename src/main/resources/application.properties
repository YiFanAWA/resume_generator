server.port=5000

# Database configuration, with environment variable overrides.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:6603/resume-portal?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# SQL initialization mode.
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.datasource.initialization-mode=${SQL_INIT_MODE:never}
spring.jpa.defer-datasource-initialization=true

# Connection pool tuning.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

# CORS configuration for separated frontend development.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
