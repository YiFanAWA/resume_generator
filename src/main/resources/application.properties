spring.application.name=resume-generator
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:5000}
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:never}
server.error.include-stacktrace=${SERVER_ERROR_INCLUDE_STACKTRACE:never}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.datasource.initialization-mode=${SQL_INIT_MODE:never}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

# Public resume cache. Dev defaults to local cache; prod can switch to Redis.
app.public-resume-cache.enabled=${PUBLIC_RESUME_CACHE_ENABLED:true}
app.public-resume-cache.backend=${PUBLIC_RESUME_CACHE_BACKEND:local}
app.public-resume-cache.ttl=${PUBLIC_RESUME_CACHE_TTL:10m}
app.public-resume-cache.maximum-size=${PUBLIC_RESUME_CACHE_MAX_SIZE:10000}
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.timeout=${REDIS_TIMEOUT:1s}
spring.data.redis.repositories.enabled=false

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,metrics}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_DETAILS:when_authorized}

logging.file.name=${LOG_FILE:logs/resume-generator.log}
app.logging.file.max-size=${LOG_FILE_MAX_SIZE:10MB}
app.logging.file.max-history=${LOG_FILE_MAX_HISTORY:14}
app.logging.file.total-size-cap=${LOG_FILE_TOTAL_SIZE_CAP:1GB}
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.daemonsets.resumeportal=${LOG_LEVEL_APP:INFO}
server.tomcat.accesslog.enabled=${ACCESS_LOG_ENABLED:false}
server.tomcat.basedir=${TOMCAT_BASEDIR:logs/tomcat}
server.tomcat.accesslog.directory=${ACCESS_LOG_DIR:access}
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D

# Keep PDF rendering diagnostics quiet during normal use and k6 runs.
logging.level.com.openhtmltopdf=WARN
logging.level.org.apache.pdfbox=WARN
logging.level.org.apache.pdfbox.pdmodel.font.FileSystemFontProvider=ERROR

# Keep false behind local HTTP or an HTTPS-terminating proxy unless forwarded headers are configured.
app.security.require-https=${APP_SECURITY_REQUIRE_HTTPS:false}
