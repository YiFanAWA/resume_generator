<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width"/>
    <title>One Page Resume</title>
    <style>
        * { margin: 0; padding: 0; }
        body { font: 16px Helvetica, Sans-Serif; line-height: 24px; background: url(/profile-templates/2/images/noise.jpg); }
        .clear { clear: both; }
        #page-wrap { width: 800px; margin: 40px auto 60px; }
        h1 { margin: 0 0 16px 0; padding: 0 0 16px 0; font-size: 42px; font-weight: bold; letter-spacing: 0; border-bottom: 1px solid #999; }
        h2 { font-size: 20px; margin: 0 0 6px 0; position: relative; }
        h2 span { position: absolute; bottom: 0; right: 0; font-style: italic; font-family: Georgia, Serif; font-size: 16px; color: #999; font-weight: normal; }
        p { margin: 0 0 16px 0; }
        a { color: #666; text-decoration: none; border-bottom: 1px dotted #999; }
        a:hover { border-bottom-style: solid; color: black; }
        ul { margin: 0 0 32px 17px; }
        #objective { width: 500px; float: left; }
        #objective p { font-family: Georgia, Serif; font-style: italic; color: #666; }
        dt { font-style: italic; font-weight: bold; font-size: 18px; text-align: right; padding: 0 26px 0 0; width: 150px; float: left; min-height: 80px; border-right: 1px solid #999; }
        dd { width: 600px; float: right; }
        dd.clear { float: none; margin: 0; height: 15px; }
        .actions { font-size: 16px; margin-left: 10px; }
        .button-link { background-color: #333; color: white; padding: 5px 15px; text-decoration: none; border: 0; }
    </style>
</head>
<body>
<div id="page-wrap">
    <div id="contact-info" class="vcard">
        <h1 class="fn">
            <span th:text="${userProfile.firstName}">First</span>
            <span th:text="${userProfile.lastName}">Last</span>
            <a class="actions" th:if="${currentUsersProfile}" href="/app/resume">Edit</a>
            <a class="actions button-link" th:if="${currentUsersProfile}" href="/api/profile/export/pdf">Export PDF</a>
        </h1>

        <p>
            Cell: <span class="tel" th:text="${userProfile.phone}">555-666-7777</span><br/>
            Email: <a th:text="${userProfile.email}" th:href="'mailto:' + ${userProfile.email}" class="email">name@example.com</a>
        </p>
    </div>

    <div id="objective" th:if="${userProfile.summary != null and !#strings.isEmpty(userProfile.summary)}">
        <p th:text="${userProfile.summary}">Professional summary</p>
    </div>

    <div class="clear"></div>

    <dl>
        <dd class="clear"></dd>

        <dt th:if="${userProfile.educations != null and !userProfile.educations.isEmpty()}">Education</dt>
        <dd th:if="${userProfile.educations != null and !userProfile.educations.isEmpty()}">
            <div th:each="education : ${userProfile.educations}">
                <h2 th:text="${education.college}">College</h2>
                <p>
                    <strong th:text="${education.qualification}">Qualification</strong><br/>
                    <span th:text="${education.formattedStartDate}">Jan 2020</span>
                    <span th:if="${education.formattedStartDate != null or education.formattedEndDate != null}"> - </span>
                    <span th:text="${education.formattedEndDate}">Dec 2022</span>
                </p>
                <p th:if="${education.summary != null and !#strings.isEmpty(education.summary)}" th:text="${education.summary}">Summary</p>
            </div>
        </dd>

        <dd class="clear"></dd>

        <dt th:if="${userProfile.skills != null and !userProfile.skills.isEmpty()}">Skills</dt>
        <dd th:if="${userProfile.skills != null and !userProfile.skills.isEmpty()}">
            <ul>
                <li th:each="skill : ${userProfile.skills}" th:text="${skill}">Skill</li>
            </ul>
        </dd>

        <dd class="clear"></dd>

        <dt th:if="${userProfile.jobs != null and !userProfile.jobs.isEmpty()}">Experience</dt>
        <dd th:if="${userProfile.jobs != null and !userProfile.jobs.isEmpty()}">
            <div th:each="job : ${userProfile.jobs}">
                <h2>
                    <span th:text="${job.company}">Company</span>
                    <span th:text="${job.designation + ' | ' + job.formattedStartDate + ' - ' + (job.currentJob ? 'Present' : job.formattedEndDate)}">Role | Jan 2020 - Present</span>
                </h2>
                <ul th:if="${job.responsibilities != null and !job.responsibilities.isEmpty()}">
                    <li th:each="responsibility : ${job.responsibilities}" th:text="${responsibility}">Responsibility</li>
                </ul>
            </div>
        </dd>

        <dd class="clear"></dd>
    </dl>

    <div class="clear"></div>
</div>
</body>
</html>
