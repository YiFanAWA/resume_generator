spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:6603}/resume-portal?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management.endpoint.health.show-details=${MANAGEMENT_HEALTH_DETAILS:when_authorized}
logging.file.name=${LOG_FILE:logs/resume-generator-dev.log}
