spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.public-resume-cache.backend=${PUBLIC_RESUME_CACHE_BACKEND:redis}

management.endpoint.health.show-details=${MANAGEMENT_HEALTH_DETAILS:never}
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:never}
server.error.include-stacktrace=${SERVER_ERROR_INCLUDE_STACKTRACE:never}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

logging.file.name=${LOG_FILE:logs/resume-generator-prod.log}
server.tomcat.accesslog.enabled=${ACCESS_LOG_ENABLED:true}
