spring.datasource.url=jdbc:h2:mem:resume_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.sql.init.mode=never
spring.datasource.initialization-mode=never
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.public-resume-cache.enabled=false
spring.data.redis.repositories.enabled=false
logging.file.name=target/test-logs/resume-generator-test.log
server.servlet.session.cookie.secure=false
app.security.require-https=false
